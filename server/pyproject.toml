[project]
name = "paisaan"
version = "0.1.0"
description = "Your own Personal Investment Agent. Make your money FOLLOW the right path."
authors = [
  { name="Pranaw Kumar", email="pranaw.kr.dev@gmail.com" }
]
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.34.0",
  "python-dotenv>=1.1.0",
  "pydantic>=2.10.0",
  "pydantic-settings>=2.7.0",
  "sqlalchemy>=2.0.0",
  "psycopg[binary]>=3.1.0",
  "psycopg_pool>=3.2.0",
  "langgraph>=0.4.0",
  "langgraph-checkpoint-postgres>=2.0.0",
  "langchain>=0.3.0",
  "langchain-google-genai>=2.1.0",
  "httpx>=0.28.0",
  "yfinance>=0.2.50",
  "razorpay>=1.4.0",
  "duckduckgo-search>=6.0.0",
  "beautifulsoup4>=4.12.0",
]

[tool.uv]
dev-dependencies = [
  "pytest>=8.0.0",
  "pytest-asyncio>=0.24.0",
  "httpx>=0.28.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
